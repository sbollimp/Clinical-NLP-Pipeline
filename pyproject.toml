[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-doc-nlp-pipeline"
version = "1.0.0"
description = "End-to-end clinical document NLP: hybrid NER, assertion detection, classification and structuring, with an explanation on every prediction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "clinical-nlp", "named-entity-recognition", "text-classification",
    "explainable-ai", "healthcare", "information-extraction", "negex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "scikit-learn>=1.1",
    "numpy>=1.22",
    "scipy>=1.8",
    "joblib>=1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
clinical-nlp = "clinical_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
